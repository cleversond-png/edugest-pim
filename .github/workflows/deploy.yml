name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Core package
        run: npm run build --workspace=@edugest-pim/core

      - name: Run linter
        run: npm run lint --workspace=web || true

      - name: Run tests (API)
        run: npm run test --workspace=@edugest-pim/api || true

      - name: Build API
        run: npm run build --workspace=@edugest-pim/api

      - name: Build Web
        run: npm run build --workspace=web

      - name: Azure Login
        uses: azure/login@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:${{ github.sha }} .
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:latest .

      - name: Push to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:latest

      - name: Update or Create Azure Container Instance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          RESOURCE_GROUP="${{ secrets.CONTAINER_RESOURCE_GROUP }}"
          CONTAINER_NAME="${{ secrets.CONTAINER_NAME }}"

          # Delete existing container if it exists
          az container delete \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --yes || true

          # Create new container with environment variables
          az container create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_NAME" \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:latest" \
            --cpu 1 \
            --memory 1.5 \
            --os-type Linux \
            --registry-username "${{ secrets.ACR_USERNAME }}" \
            --registry-password "${{ secrets.ACR_PASSWORD }}" \
            --ports 3000 \
            --dns-name-label edugest-prod \
            --environment-variables \
              PORT=3000 \
              NODE_ENV=production \
              API_KEY="${{ secrets.API_KEY }}" \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
              AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
              AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
              SHAREPOINT_SITE_ID="${{ secrets.SHAREPOINT_SITE_ID }}" \
              SHAREPOINT_DRIVE_ID="${{ secrets.SHAREPOINT_DRIVE_ID }}" \
              SHAREPOINT_BASE_FOLDER="EduGest-PIM" \
            --no-wait

      - name: Azure Logout
        if: always()
        run: az logout

  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-deploy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Core package
        run: npm run build --workspace=@edugest-pim/core

      - name: Build Next.js
        run: npm run build --workspace=web
        env:
          NEXT_PUBLIC_API_URL: 'https://ca-edugest-prod-backend.purpleground-cde5672b.brazilsouth.azurecontainerapps.io'

      - name: Copy staticwebapp.config.json to build output
        run: cp apps/web/staticwebapp.config.json apps/web/.next/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'apps/web'
          output_location: '.next'
          skip_app_build: true

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-deploy, deploy-frontend]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          echo "Backend Deployment: ${{ needs.build-and-deploy.result }}"
          echo "Frontend Deployment: ${{ needs.deploy-frontend.result }}"
          if [ "${{ needs.build-and-deploy.result }}" == "success" ] && [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
            echo "✅ All deployments successful!"
          else
            echo "⚠️  Check deployment results above."
          fi
