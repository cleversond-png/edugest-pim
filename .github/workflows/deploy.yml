name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Core package
        run: npm run build --workspace=@edugest-pim/core

      - name: Run linter
        run: npm run lint --workspace=web || true

      - name: Run tests (API)
        run: npm run test --workspace=@edugest-pim/api || true

      - name: Build API
        run: npm run build --workspace=@edugest-pim/api

      - name: Build Web (standalone)
        run: npm run build --workspace=web
        env:
          NEXT_PUBLIC_API_URL: 'https://ca-edugest-prod-backend.purpleground-cde5672b.brazilsouth.azurecontainerapps.io'

      - name: Azure Login
        uses: azure/login@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build --no-cache -t ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:${{ github.sha }} .
          docker build --no-cache -t ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:latest .

      - name: Push to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:latest

      - name: Deploy to Azure Container Apps (Backend)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --resource-group rg-edugest-prod \
            --name ca-edugest-prod-backend \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:latest

      - name: Deploy to Azure Container Apps (Frontend)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --resource-group rg-edugest-prod \
            --name ca-edugest-pim-web \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim-web:latest

      - name: Azure Logout
        if: always()
        run: az logout

  notify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()

    steps:
      - name: Deployment Status
        run: |
          echo "Deployment Result: ${{ needs.build-and-deploy.result }}"
          if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful! Frontend served by Fastify."
          else
            echo "⚠️  Check deployment logs above."
          fi
