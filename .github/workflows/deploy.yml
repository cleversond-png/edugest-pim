name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Core package
        run: npm run build --workspace=@edugest-pim/core

      - name: Run linter
        run: npm run lint --workspace=web || true

      - name: Run tests (API)
        run: npm run test --workspace=@edugest-pim/api || true

      - name: Build API
        run: npm run build --workspace=@edugest-pim/api

      - name: Build Web
        run: npm run build --workspace=web

      - name: Azure Login
        uses: azure/login@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:${{ github.sha }} .
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:latest .

      - name: Push to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/edugest-pim:latest

      - name: Restart Azure Container Instance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az container restart \
            --resource-group ${{ secrets.CONTAINER_RESOURCE_GROUP }} \
            --name ${{ secrets.CONTAINER_NAME }} \
            --no-wait || true

      - name: Azure Logout
        if: always()
        run: az logout

  notify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()

    steps:
      - name: Deployment Status
        run: |
          echo "Deployment Status: ${{ needs.build-and-deploy.result }}"
          if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
            echo "✅ Deployment to pmi.plantaoti.com.br successful!"
          else
            echo "❌ Deployment failed. Check logs above."
          fi
